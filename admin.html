<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin dashboard · EventHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="globalLoader" class="position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center" style="z-index:2000;background:var(--bg)">
    <div class="spinner-border text-info" style="width:3rem;height:3rem" role="status"><span class="visually-hidden">Loading...</span></div>
  </div>

  <nav class="navbar navbar-expand navbar-glass sticky-top">
    <div class="container">
      <span class="navbar-brand fw-bold gradient-text"><i class="bi bi-shield-lock me-1"></i>EventHub Admin</span>
      <div class="d-flex align-items-center gap-3">
        <span class="small muted d-none d-sm-inline"><span id="adminName">Admin</span></span>
        <button id="logoutBtn" class="btn btn-sm btn-outline-light"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
      </div>
    </div>
  </nav>

  <main class="container py-4 py-md-5">
    <header class="mb-4 fade-up">
      <h1 class="fw-bold">Admin <span class="gradient-text">control center</span></h1>
      <p class="muted mb-0">Manage events, attendees and student accounts.</p>
    </header>

    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3 fade-up"><div class="glass stat-card d-flex align-items-center gap-3"><div class="stat-icon"><i class="bi bi-calendar3"></i></div><div><div class="small muted">Total events</div><div class="h4 fw-bold mb-0" id="statEvents">–</div></div></div></div>
      <div class="col-6 col-lg-3 fade-up" style="animation-delay:.1s"><div class="glass stat-card d-flex align-items-center gap-3"><div class="stat-icon"><i class="bi bi-calendar-check"></i></div><div><div class="small muted">Upcoming</div><div class="h4 fw-bold mb-0" id="statUpcoming">–</div></div></div></div>
      <div class="col-6 col-lg-3 fade-up" style="animation-delay:.2s"><div class="glass stat-card d-flex align-items-center gap-3"><div class="stat-icon"><i class="bi bi-people"></i></div><div><div class="small muted">Students</div><div class="h4 fw-bold mb-0" id="statStudents">–</div></div></div></div>
      <div class="col-6 col-lg-3 fade-up" style="animation-delay:.3s"><div class="glass stat-card d-flex align-items-center gap-3"><div class="stat-icon"><i class="bi bi-ticket-perforated"></i></div><div><div class="small muted">Registrations</div><div class="h4 fw-bold mb-0" id="statRegs">–</div></div></div></div>
    </div>

    <ul class="nav nav-pills mb-4" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#eventsTab" type="button">Events</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#studentsTab" type="button">Students</button></li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="eventsTab">
        <div class="d-flex flex-column flex-md-row gap-2 justify-content-between mb-3">
          <input id="eventSearch" class="form-control" placeholder="Search events" style="max-width:360px">
          <button id="newEventBtn" class="btn btn-neon"><i class="bi bi-plus-lg me-1"></i>New event</button>
        </div>
        <div id="eventsTable"></div>
        <div id="eventsEmpty" class="empty-state d-none">
          <i class="bi bi-calendar-plus"></i>
          <h5 class="mt-3">No events yet</h5>
          <p class="mb-0">Create your first event to get started.</p>
        </div>
      </div>

      <div class="tab-pane fade" id="studentsTab">
        <div class="mb-3"><input id="studentSearch" class="form-control" placeholder="Search by name, roll number or email" style="max-width:420px"></div>
        <div id="studentsTable"></div>
        <div id="studentsEmpty" class="empty-state d-none">
          <i class="bi bi-person-x"></i>
          <h5 class="mt-3">No students found</h5>
          <p class="mb-0">Students who sign up will appear here.</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Create / edit event -->
  <div class="modal fade" id="eventModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
      <div class="modal-content glass-modal">
        <form id="eventForm" novalidate>
          <div class="modal-header border-0">
            <h5 class="modal-title fw-bold" id="eventModalTitle">New event</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="eventId">
            <div class="row g-3">
              <div class="col-md-8">
                <label class="form-label" for="evTitle">Title *</label>
                <input id="evTitle" class="form-control" maxlength="120" required>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="evCategory">Category *</label>
                <select id="evCategory" class="form-select" required></select>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="evDate">Date *</label>
                <input id="evDate" type="date" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="evTime">Start time *</label>
                <input id="evTime" type="time" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="evCapacity">Capacity *</label>
                <input id="evCapacity" type="number" min="1" max="5000" class="form-control" required>
              </div>
              <div class="col-12">
                <label class="form-label" for="evLocation">Location *</label>
                <input id="evLocation" class="form-control" maxlength="150" required>
              </div>
              <div class="col-12">
                <label class="form-label" for="evDescription">Description</label>
                <textarea id="evDescription" class="form-control" rows="4" maxlength="1000"></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
            <button id="saveEventBtn" type="submit" class="btn btn-neon">Save event</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Attendees -->
  <div class="modal fade" id="attendeesModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
      <div class="modal-content glass-modal">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold" id="attendeesTitle">Attendees</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="attendeesBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
