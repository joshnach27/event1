<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · EventHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="auth-wrap">
    <div class="glass auth-card">
      <div class="text-center mb-4">
        <i class="bi bi-stars display-5 gradient-text"></i>
        <h1 class="h3 fw-bold mt-2">Welcome back</h1>
        <p class="muted mb-0">Sign in to EventHub (students and admins)</p>
      </div>
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input id="email" type="email" class="form-control" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <input id="password" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button id="loginBtn" type="submit" class="btn btn-neon w-100 py-2">Sign in</button>
      </form>
      <p class="text-center mt-4 mb-0 small muted">New student? <a href="signup.html" class="text-info">Create an account</a></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
