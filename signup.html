<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student sign up · EventHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="auth-wrap">
    <div class="glass auth-card">
      <div class="text-center mb-4">
        <i class="bi bi-person-plus display-5 gradient-text"></i>
        <h1 class="h3 fw-bold mt-2">Create student account</h1>
        <p class="muted mb-0">Use your official roll number</p>
      </div>
      <form id="signupForm" novalidate>
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label" for="fullName">Full name</label>
            <input id="fullName" class="form-control" maxlength="100" autocomplete="name" required>
          </div>
          <div class="col-12">
            <label class="form-label" for="rollNumber">Roll number</label>
            <input id="rollNumber" class="form-control text-uppercase" maxlength="20" placeholder="e.g. 21CE0123" required>
            <div class="form-text muted">4–20 characters: letters, numbers or hyphens. Each roll number can be used once.</div>
          </div>
          <div class="col-12">
            <label class="form-label" for="signupEmail">Email</label>
            <input id="signupEmail" type="email" class="form-control" autocomplete="email" required>
          </div>
          <div class="col-12">
            <label class="form-label" for="signupPassword">Password</label>
            <input id="signupPassword" type="password" class="form-control" autocomplete="new-password" required>
            <div class="form-text muted">Min 8 characters with upper and lower case, a number and a special character.</div>
          </div>
          <div class="col-12">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" type="password" class="form-control" autocomplete="new-password" required>
          </div>
        </div>
        <button id="signupBtn" type="submit" class="btn btn-neon w-100 py-2 mt-4">Create account</button>
      </form>
      <p class="text-center mt-4 mb-0 small muted">Already registered? <a href="login.html" class="text-info">Sign in</a></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/signup.js"></script>
</body>
</html>
